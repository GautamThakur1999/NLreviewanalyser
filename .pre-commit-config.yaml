repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .*/tests/.*

  - repo: local
    hooks:
      - id: no-bare-open
        name: Forbid bare open() (ST-01)
        entry: 'open\([^,)]+\)'
        language: pygrep
        types: [python]
        exclude: ^tests/

      - id: no-vendor-imports
        name: Forbid vendor imports outside engine/llm/ (ST-08)
        entry: '^(import groq|from groq|import google|from google)'
        language: pygrep
        types: [python]
        exclude: ^(engine/llm/|tests/)
