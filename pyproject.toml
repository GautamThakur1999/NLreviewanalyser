[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
description = "Blinkit Review Analyser — AI-Powered Discovery Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.9.0",
    "google-genai>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "google-play-scraper>=1.2.0",
    "praw>=7.7.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "selectolax>=0.3.21",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.6.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
engine = "engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
